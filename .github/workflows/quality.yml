name: 工程质量门禁

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: 安装锁定依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: 静态检查
        run: python -m ruff check backend scripts
      - name: 单元与集成测试
        run: python -m pytest --cov=backend.app --cov-report=term-missing:skip-covered --cov-report=xml --cov-fail-under=80
      - name: Python 编译检查
        run: python -m compileall -q backend scripts
      - name: 依赖一致性检查
        run: python -m pip check

  frontend:
    name: 前端 · 类型、测试与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: 安装锁定依赖
        run: pnpm install --frozen-lockfile
      - name: TypeScript 类型检查
        run: pnpm typecheck
      - name: 前端测试与覆盖率
        run: pnpm test:coverage
      - name: 生产构建
        run: pnpm build

  smoke:
    name: Demo Provider 完整冒烟
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: 安装锁定依赖
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: 执行离线完整工作流
        env:
          DEVTEAM_ENV: test
          DEVTEAM_LLM_PROVIDER: demo
          DEVTEAM_DATABASE_URL: sqlite:///./data/ci-smoke.db
          DEVTEAM_DATABASE_AUTO_CREATE: "true"
          DEVTEAM_SMOKE_EXECUTION_TIMEOUT: "180"
          DEVTEAM_SMOKE_WORKSPACE: ${{ runner.temp }}/devteam-smoke
        run: |
          mkdir -p data "$DEVTEAM_SMOKE_WORKSPACE"
          python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/ready; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8000/api/v1/ready
          python scripts/smoke_test.py

  container:
    name: 容器镜像构建
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: 构建应用镜像
        run: docker build --tag devteam-agent:ci .
